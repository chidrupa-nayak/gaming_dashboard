<div class="chart-card">
  <div class="card-header">
    <h2>📈 Sessions This Week</h2>
    <span class="subtitle">Daily active sessions</span>
  </div>
  <div class="chart-wrap">
    <canvas baseChart
      [data]="chartData()"
      [options]="chartOptions"
      type="line">
    </canvas>
  </div>
</div>
