<div class="page">
  <div class="page-head">
    <div>
      <h1>👥 Players</h1>
      <p class="page-meta">{{ filtered().length }} of {{ 8 }} players</p>
    </div>
    <input
      class="search-input"
      type="text"
      placeholder="Search players…"
      [value]="searchTerm()"
      (input)="onSearch($event)"
      aria-label="Search players"
    />
  </div>

  <div class="players-grid">
    @for (p of filtered(); track p.rank) {
      <div class="player-card">
        <div class="card-rank">{{ rankMedal(p.rank) }}</div>
        <div class="avatar">{{ p.avatar }}</div>
        <div class="player-name">{{ p.name }}</div>
        <div class="player-score">{{ p.score | number }}</div>
        <div class="wl-row">
          <span class="wins">{{ p.wins }}W</span>
          <span class="sep">/</span>
          <span class="losses">{{ p.losses }}L</span>
        </div>
        <div class="wr-row">
          <div class="wr-track">
            <div class="wr-fill" [style.width.%]="p.winRate"></div>
          </div>
          <span class="wr-label">{{ p.winRate }}%</span>
        </div>
      </div>
    }
    @if (filtered().length === 0) {
      <p class="no-results">No players match "{{ searchTerm() }}"</p>
    }
  </div>
</div>
