<div class="page">
  <div class="page-head">
    <div>
      <h1>📈 Analytics</h1>
      <p class="page-meta">Season overview · last 7 days</p>
    </div>
  </div>

  <div class="metrics-row">
    @for (m of metrics; track m.label) {
      <div class="metric-card">
        <span class="metric-icon">{{ m.icon }}</span>
        <span class="metric-value">{{ m.value }}</span>
        <span class="metric-label">{{ m.label }}</span>
      </div>
    }
  </div>

  <div class="charts-grid">
    <div class="chart-card">
      <div class="chart-card-header">
        <h2>Active Sessions</h2>
        <span class="chart-subtitle">Daily this week</span>
      </div>
      <div class="chart-wrap">
        <canvas baseChart
          [data]="sessionsData()"
          [options]="lineOptions"
          type="line">
        </canvas>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-card-header">
        <h2>Matches by Mode</h2>
        <span class="chart-subtitle">All-time distribution</span>
      </div>
      <div class="chart-wrap">
        <canvas baseChart
          [data]="matchesByModeData"
          [options]="barOptions"
          type="bar">
        </canvas>
      </div>
    </div>
  </div>
</div>
